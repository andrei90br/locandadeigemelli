<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Locanda dei Gemelli · Dimaro Folgarida</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Inter:wght@400&display=swap" rel="stylesheet">
  <style>
    :root { --paper: #f6f0e6; --accent: #e58a63; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100svh; display: flex; align-items: center; justify-content: center;
      background: #000; color: var(--paper); font: 400 16px/1.6 'Inter', system-ui, sans-serif; text-align: center;
      padding: 48px 16px;
    }
    main { max-width: 640px; }
    img { width: min(320px, 70vw); height: auto; display: block; margin: 0 auto 40px; }
    p.soon { font-family: 'Oswald', 'Arial Narrow', sans-serif; text-transform: uppercase; letter-spacing: 0.16em; color: var(--accent); margin: 0 0 18px; font-weight: 600; }
    ul { list-style: none; padding: 0; margin: 0 0 32px; display: grid; gap: 6px; }
    li { font-family: 'Oswald', 'Arial Narrow', sans-serif; text-transform: uppercase; letter-spacing: 0.06em; font-size: 1.05rem; }
    li span { opacity: 0.55; margin-right: 8px; font-size: 0.8rem; }
    address { font-style: normal; opacity: 0.75; font-size: 0.95rem; }
  </style>
</head>
<body>
  <main>
    <img src="logo.svg" alt="La Locanda dei Gemelli" width="539" height="568">
    <p class="soon">Ristorante · Pizzeria · Appartamenti</p>
    <ul>
      <li lang="it"><span>IT</span>Il nuovo sito è in arrivo</li>
      <li lang="en"><span>EN</span>Our new website is coming soon</li>
      <li lang="de"><span>DE</span>Unsere neue Website kommt bald</li>
      <li lang="pl"><span>PL</span>Nowa strona już wkrótce</li>
    </ul>
    <address>Via Campiglio 59, 38025 Dimaro Folgarida (TN)</address>
  </main>
</body>
</html>
